<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contatos | APIs WhatsApp e Telefone</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f3f3;
            margin: 0;
            padding: 0;
        }

        header {
            background: #0a4d97;
            padding: 20px;
            color: white;
            text-align: center;
        }

        h1 {
            margin: 0;
        }

        .conteudo {
            max-width: 700px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
        }

        .contatos {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }

        a.btn {
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
        }

        a.whats {
            background: #25D366;
        }

        a.call {
            background: #0066ff;
        }

        a.voltar {
            margin-top: 30px;
            display: block;
            text-align: center;
            padding: 10px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Contato da Instituição</h1>
    </header>

    <div class="conteudo">

        <h2>APIs de WhatsApp e Telefone</h2>
        <p>
            Aqui você encontra formas rápidas de contato com a instituição.
            Basta clicar em um dos botões abaixo para iniciar a conversa ou ligação.
        </p>

        <div class="contatos">
            <a class="btn whats" 
               href="https://api.whatsapp.com/send?phone=5531995268163&text=Olá! Gostaria de falar com o suporte."
               target="_blank">
               📱 Falar no WhatsApp
            </a>

            <a class="btn call" href="tel:+5531995268163">
                ☎️ Fazer Ligação
            </a>
        </div>

        <a class="voltar" href="index.html">⬅ Voltar ao Sistema Acadêmico</a>

    </div>

</body>
</html>
